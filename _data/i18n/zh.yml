fun_experience:
  heading: "其他经历"
  title_bold: "图灵研究所 DSG 黑客松："
  title_rest: "海上地震勘探数据中的浅层气体检测（艾伦·图灵研究所 Data Study Group 挑战赛）"
  intro: "在为期一周的高强度协作中，我与来自世界各地的跨学科团队共同完成了以下工作："
  bullets:
    - "探索用于地理空间模式识别的 CNN 架构与集成学习方法。"
    - "针对噪声大、对比度低的海洋数据集，开发了浅层气体识别的分类、分割与目标检测模型。"
    - "参与撰写面向产业合作方 BP 的项目结题报告，并以侧重可解释性的可视化方式呈现结果。"

teaching_trips:
  heading: "教学出访"
  title_bold: "数据与人工智能："
  title_rest: "面向病原体基因组学的课程（菲律宾、印度尼西亚、泰国、英国）"
  intro: "在多个国家开展为期一周的强化课程，面向来自世界各地的研究人员："
  bullets:
    - "讲授 <strong>Bash 编程</strong>与命令行软件的使用。"
    - "讲授团队自主开发的基因组测序流程背后的<strong>数学与生物学原理</strong>。"
    - "使用 <strong>LangChain</strong> 与 <strong>ChromaDB</strong> 构建基于课程内容的 <strong>RAG 问答机器人</strong>，支持学员互动答疑。"
    - "开设一对一问题研讨：针对学员实际研究中的问题，提供人工智能与生物信息学解决方案。"

